name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libomp on macOS (required by upstream lightgbm package for parity tests)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Report detected CPU SIMD ISA
        run: |
          python -c "import lgbm_boost; print('Detected SIMD ISA:', lgbm_boost.detect_best_isa())"

      - name: Run pytest & Hypothesis test suite
        run: pytest -v

      - name: Run x86_64 benchmark smoke check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python benchmarks/run_suite.py --rows 1000 10000 100000 --leaves 31 63 --repeats 3

  auto-tag:
    name: Auto-Tag Release from pyproject.toml
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create tag and GitHub Release if version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v${VERSION}"
          echo "Detected project version: ${VERSION} -> tag ${TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping tag creation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" --title "${TAG}" --generate-notes
