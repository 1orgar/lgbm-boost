name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-latest
            archs: "arm64 x86_64"
          - os: windows-latest
            archs: AMD64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - name: Upload built wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish_pypi:
    name: Publish wheels and sdist to PyPI
    needs: [build_wheels, build_sdist]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'release' && github.event.action == 'published') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: pypi-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write

    steps:
      - name: Download all built distributions
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish distribution to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
