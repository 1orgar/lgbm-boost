name: Publish to PyPI & GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_linux_x86_64_wheel:
    name: Build Linux x86_64 py3-none wheel (OL8/OL9 manylinux2014)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build single Python-ABI-independent x86_64 wheel in manylinux2014 (glibc 2.17+)
        run: |
          mkdir -p wheelhouse
          docker run --rm \
            -v "${PWD}:/workspace:ro" \
            -v "${PWD}/wheelhouse:/out" \
            quay.io/pypa/manylinux2014_x86_64:latest \
            bash -euxc '
              g++ --version
              mkdir -p /tmp/src /tmp/raw
              cp -a /workspace/CMakeLists.txt /workspace/LICENSE /workspace/README.md /workspace/pyproject.toml \
                    /workspace/include /workspace/src /workspace/python /workspace/tests /tmp/src/
              /opt/python/cp312-cp312/bin/pip wheel /tmp/src --no-deps -w /tmp/raw
              auditwheel repair /tmp/raw/lgbm_boost-*.whl --plat manylinux2014_x86_64 -w /out
              ls -lh /out
            '

      - name: Verify single py3-none wheel across Python 3.9/3.11/3.12 on clean Oracle Linux 8 & 9
        run: |
          docker run --rm \
            -v "${PWD}/wheelhouse:/wheels:ro" \
            -v "${PWD}/tests/test_wheel_smoke.py:/tmp/test_wheel_smoke.py:ro" \
            oraclelinux:8 \
            bash -euxc '
              dnf install -y python39 python39-pip python3.11 python3.11-pip python3.12 python3.12-pip
              for PY in /usr/bin/python3.9 /usr/bin/python3.11 /usr/bin/python3.12; do
                "${PY}" -m pip install --only-binary=lgbm-boost --find-links=/wheels lgbm-boost numpy pytest
                "${PY}" -m pytest /tmp/test_wheel_smoke.py -v
              done
            '

          docker run --rm \
            -v "${PWD}/wheelhouse:/wheels:ro" \
            -v "${PWD}/tests/test_wheel_smoke.py:/tmp/test_wheel_smoke.py:ro" \
            oraclelinux:9 \
            bash -euxc '
              dnf install -y python3 python3-pip python3.11 python3.11-pip python3.12 python3.12-pip
              for PY in /usr/bin/python3 /usr/bin/python3.11 /usr/bin/python3.12; do
                "${PY}" -m pip install --only-binary=lgbm-boost --find-links=/wheels lgbm-boost numpy pytest
                "${PY}" -m pytest /tmp/test_wheel_smoke.py -v
              done
            '

      - name: Upload Linux x86_64 py3-none wheel
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-linux-x86_64
          path: ./wheelhouse/*manylinux*.whl

  build_wheels:
    name: Build py3-none wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-latest
            archs: "arm64 x86_64"
          - os: windows-latest
            archs: AMD64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test py3-none wheel with cibuildwheel
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - name: Upload built wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish_pypi:
    name: Publish wheels and sdist to PyPI
    needs: [build_linux_x86_64_wheel, build_wheels, build_sdist]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: pypi-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write

    steps:
      - name: Download all built distributions
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish distribution to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  upload_github_release:
    name: Attach precompiled WHL & sdist to GitHub Release
    needs: [build_linux_x86_64_wheel, build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download wheels and sdist
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: release_assets
          merge-multiple: true

      - name: Upload WHL and sdist assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          rm -f release_assets/*musllinux*.whl
          ls -lh release_assets/
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --title "${TAG_NAME}" --generate-notes
          fi
          gh release upload "${TAG_NAME}" release_assets/* --clobber
